# Stage-1 benchmark suite -- environment definition.
#
# Two environments on purpose. vLLM hard-pins its torch version, so sharing a
# single env risks silently breaking the DDP/FSDP/DeepSpeed stack. They are
# created with --prefix inside the project directory so the whole suite,
# including its environments and caches, is one deletable tree.
#
#   conda create --prefix ./envs/bench-train python=3.10 -y
#   ./envs/bench-train/bin/pip install torch==2.4.1 torchvision==0.19.1 \
#       --index-url https://download.pytorch.org/whl/cu121
#   ./envs/bench-train/bin/pip install -r requirements-train.txt
#
#   conda create --prefix ./envs/bench-vllm python=3.10 -y
#   ./envs/bench-vllm/bin/pip install -r requirements-vllm.txt
#
# NOTE on the vLLM env: install vllm==0.6.3.post1 first, then pin
# transformers==4.45.2 and tokenizers<0.21 afterwards. Left unpinned, pip
# resolves transformers 5.x, which vLLM 0.6.3 cannot use.
# This YAML describes a training starting point only. The vLLM environment
# is separate; use docs/REPRODUCING.md and the *-minimal.txt install recipes.
name: gpu-bench-stage1-train
channels: [defaults]
dependencies:
  - python=3.10
  - pip
  - pip:
      # see requirements-train.txt / requirements-vllm.txt for exact pins
      - torch==2.4.1
      - torchvision==0.19.1
      - transformers==4.44.2
      - accelerate==0.34.2
      - deepspeed==0.15.1
      - pandas==2.2.3
      - tabulate
