name: validation_v2_inference_pilot
kind: vllm
repeats: 1
defaults:
  num_prompts: 32
  input_len: 512
  output_len: 256
  warmup_prompts: 8
  seed: 1234
workloads:
  - model: qwen2.5-1.5b
    layouts:
      - {tp: 1, dp: 1, max_num_seqs: 256}
      - {tp: 2, dp: 1, max_num_seqs: 512}
      - {tp: 1, dp: 2, max_num_seqs: 256}
