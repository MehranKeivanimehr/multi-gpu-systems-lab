# TEMPLATE: a distinct sustained-energy experiment is needed for energy claims.
name: validation_v2_inference_repeats
kind: vllm
repeats: 5
defaults:
  num_prompts: 1024
  input_len: 512
  output_len: 256
  warmup_prompts: 32
  seed: 1234
workloads:
  - model: qwen2.5-1.5b
    layouts:
      - {tp: 1, dp: 1, max_num_seqs: 256}
      - {tp: 2, dp: 1, max_num_seqs: 512}
      - {tp: 1, dp: 2, max_num_seqs: 256}
      - {tp: 4, dp: 1, max_num_seqs: 1024, env: {NCCL_P2P_LEVEL: NVL}}
      - {tp: 1, dp: 4, max_num_seqs: 256}
  - model: llama3.1-8b
    layouts:
      - {tp: 1, dp: 1, max_num_seqs: 256}
      - {tp: 2, dp: 1, max_num_seqs: 512}
      - {tp: 1, dp: 2, max_num_seqs: 256}
      - {tp: 4, dp: 1, max_num_seqs: 1024, env: {NCCL_P2P_LEVEL: NVL}}
      - {tp: 1, dp: 4, max_num_seqs: 256}
