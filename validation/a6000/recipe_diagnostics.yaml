# Diagnostic timings are NOT performance results. Review the case budget first.
name: validation_v2_recipe_diagnostics
kind: train
repeats: 1
gpu_counts: [1, 2, 4]
defaults:
  warmup_steps: 3
  measure_steps: 5
  seed: 1234
  grad_accum: 1
  numerical_checks: true
workloads:
  - model: resnet50
    micro_batch: 128
    ds_precision: autocast
    frameworks: [ddp, fsdp, zero1, zero2]
  - model: qwen2.5-1.5b
    seq_len: 1024
    micro_batch: 1
    grad_accum: 4
    activation_checkpointing: false
    frameworks: [ddp, fsdp, zero1, zero2]
