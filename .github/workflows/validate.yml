name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B tools/release_checks.py --profile portable
  torch-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1+cpu
      - run: python -m pip install numpy==1.26.4
      - run: python -B tools/release_checks.py --profile torch
  posix:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B tools/release_checks.py --profile posix
