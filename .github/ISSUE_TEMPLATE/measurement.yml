name: Measurement or comparison proposal
description: Propose a new benchmark or clarify a comparison.
body:
  - type: textarea
    id: question
    attributes:
      label: Research question
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Protocol
      description: Hardware, model, task, precision, optimizer, batches, sequence lengths, repeats, and serving settings.
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Existing comparison baseline
      description: Identify a run and explain which settings match or differ.
