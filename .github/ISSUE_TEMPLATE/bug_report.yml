name: Bug report
description: Report an execution, analysis, or documentation issue.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the campaign and the relevant run or file.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact command, expected behavior, and observed behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, GPU model/count/topology, driver, Python, and library versions.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach relevant status records and log excerpts with credentials removed.
