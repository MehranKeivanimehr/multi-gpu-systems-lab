<text x="704.404" y="251.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#087f8c" text-anchor="start">0.0005233</text>
<text x="42.000" y="342.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#142234" text-anchor="start">Maximum five-step loss difference</text>
<circle cx="756.629" cy="337.000" r="9" fill="#087f8c"/>
<text x="774.629" y="343.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#087f8c" text-anchor="start">0.001948</text>
<text x="42.000" y="434.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#142234" text-anchor="start">Five-update parameter change</text>
