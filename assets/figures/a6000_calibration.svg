<text x="653.723" y="435.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#087f8c" text-anchor="start">0.0002026</text>
<text x="475.000" y="551.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#566779" text-anchor="start">Observed relative error / frozen upper limit (log scale)</text>
<text x="42.000" y="551.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087f8c" text-anchor="start">All six endpoints pass.</text>
