<text x="42.000" y="634.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#566779" text-anchor="start">Three upper-bound endpoints shown; cosine endpoints also pass. Fixed slices: 787,968 elements × four arrays, 12.6 MB.</text>
