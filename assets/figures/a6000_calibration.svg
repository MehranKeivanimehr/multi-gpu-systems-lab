<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>Replayable five-update A6000 calibration</title>
<rect x="0.000" y="0.000" width="1200.000" height="660.000" rx="0" fill="#f5f7fa"/>
<rect x="42.000" y="30.000" width="32.000" height="5.000" rx="0" fill="#76b900"/>
<text x="86.000" y="40.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#566779" text-anchor="start">A6000 / CONTROL C</text>
<text x="42.000" y="94.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#142234" text-anchor="start">A control you can replay.</text>
<text x="42.000" y="130.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#566779" text-anchor="start">Same 20 global inputs · FP32 DDP · one GPU / accumulation 4 vs two GPUs / accumulation 2</text>
