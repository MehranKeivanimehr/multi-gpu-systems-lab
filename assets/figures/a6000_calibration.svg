<line x1="967.000" y1="192.000" x2="967.000" y2="480.000" stroke="#dbe3eb" stroke-width="1"/>
<text x="967.000" y="513.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="middle">0.1</text>
<line x1="1090.000" y1="192.000" x2="1090.000" y2="480.000" stroke="#b66a18" stroke-width="2" stroke-dasharray="7 6"/>
