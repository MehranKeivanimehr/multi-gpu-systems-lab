<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>The measurement-to-release evidence path</title>
<rect x="0.000" y="0.000" width="1200.000" height="520.000" rx="0" fill="#f5f7fa"/>
<rect x="42.000" y="30.000" width="32.000" height="5.000" rx="0" fill="#76b900"/>
<text x="86.000" y="40.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#566779" text-anchor="start">ENGINEERING / EVIDENCE FLOW</text>
<text x="42.000" y="94.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#142234" text-anchor="start">From a run to a defensible result.</text>
<text x="42.000" y="130.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#566779" text-anchor="start">Recorded observations and reproducible checks have different responsibilities.</text>
<rect x="42.000" y="197.000" width="260.000" height="211.000" rx="12" fill="#ffffff"/>
<text x="64.000" y="236.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087f8c" text-anchor="start">01</text>
<text x="64.000" y="278.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#142234" text-anchor="start">MEASURE</text>
<text x="64.000" y="317.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">Pinned recipe and inputs</text>
<text x="64.000" y="346.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">Per-rank identities</text>
<text x="64.000" y="375.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">Raw results and failures</text>
<text x="311.000" y="305.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="start">›</text>
<rect x="329.000" y="197.000" width="260.000" height="211.000" rx="12" fill="#ffffff"/>
<text x="351.000" y="236.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087f8c" text-anchor="start">02</text>
<text x="351.000" y="278.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#142234" text-anchor="start">RECONCILE</text>
<text x="351.000" y="317.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">Expected / observed coverage</text>
<text x="351.000" y="346.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">Optimizer-boundary evidence</text>
<text x="351.000" y="375.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">Explicit refusal states</text>
<text x="598.000" y="305.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="start">›</text>
<rect x="616.000" y="197.000" width="260.000" height="211.000" rx="12" fill="#ffffff"/>
<text x="638.000" y="236.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087f8c" text-anchor="start">03</text>
<text x="638.000" y="278.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#142234" text-anchor="start">REPLAY</text>
<text x="638.000" y="317.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">Fixed slices and logits</text>
<text x="638.000" y="346.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">CPU numerical comparison</text>
<text x="638.000" y="375.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">Checksums and negative tests</text>
<text x="885.000" y="305.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="start">›</text>
<rect x="903.000" y="197.000" width="260.000" height="211.000" rx="12" fill="#ffffff"/>
<text x="925.000" y="236.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087f8c" text-anchor="start">04</text>
<text x="925.000" y="278.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#142234" text-anchor="start">PUBLISH</text>
<text x="925.000" y="317.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">Traceable figures and tables</text>
<text x="925.000" y="346.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">Scoped conclusions</text>
<text x="925.000" y="375.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#566779" text-anchor="start">Portable verification</text>
<line x1="42.000" y1="463.000" x2="1158.000" y2="463.000" stroke="#dbe3eb" stroke-width="1"/>
<text x="42.000" y="494.000" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#566779" text-anchor="start">Architecture summary of the supplied implementation, not a claim that every historical run exercised every safeguard.</text>
</svg>
